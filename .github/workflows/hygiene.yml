name: Release hygiene

# Two checks that nothing else catches, because both failure modes look healthy
# from the outside.
#
# A SHA-pinned action is the supply-chain control, but the version comment beside
# it is what a reviewer reads, and nothing keeps the two in step. A pin can also
# be perfectly self-consistent and a year stale: laranail/confetti carried
# setup-php 2.34.1 for fourteen months because the github-actions ecosystem sat on
# the default limit of five open pull requests and had filed exactly five.
#
# Pre-1.0 the tag moves and consumers resolve ^0.1 through it, so a tag left
# behind main does not ship them older features, it ships them code without the
# fixes. Fifteen repositories in this org were in that state when this was written.

on:
  schedule:
    - cron: '7 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify-action-pins.py'
      - 'scripts/verify-tag-currency.sh'
      - 'scripts/verify-trait-copies.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Verify every pin is honest and current
        run: python3 scripts/verify-action-pins.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Release currency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Not on pull requests: the tag is expected to lag between pushing a commit
    # and moving it, and a job that fails for the minute in between is one people
    # learn to ignore.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Verify the moving tag is on main
        run: bash scripts/verify-tag-currency.sh ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trait-copies:
    name: Trait copies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only org-wide check here. The other three ask about this repository --
    # its pins, its tag, its archive. This one asks which packages in the family
    # keep a local copy of the naming trait, and whether each still has a reason
    # that holds.
    #
    # It lives on this caller alone, deliberately. Run from all 37 repositories it
    # would assert the same fact 37 times a week and, when it broke, go red in 37
    # of them -- none necessarily the one that drifted.
    #
    # A SCHEDULED DRIFT DETECTOR, NOT A MERGE GATE. It reads every package's
    # default branch over the API, so a pull request that adds an undeclared copy
    # is caught on the next run rather than before it merges. Closing that needs
    # the check to overlay the caller's working tree on the org it reads, which is
    # a change to the script, not to this file.
    #
    # Why it exists: the conformance docblocks name which packages carry a copy
    # and why, that prose went wrong twice in one day, and every check stayed
    # green both times -- those tests assert the trait's behaviour, which is
    # identical whether a package carries a copy or imports one.
    steps:
      - uses: actions/checkout@v7

      - name: Every trait copy declares a reason that still holds
        run: python3 scripts/verify-trait-copies.py --org ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dist:
    name: Dist integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A file composer.json references and .gitattributes strips is invisible in
    # the repository and fatal in a consumer's vendor/. It needs both a
    # reference and an export-ignore, so neither line looks wrong on its own.
    steps:
      - uses: actions/checkout@v7

      - name: Every referenced path survives the archive
        run: bin/laranail-dist-integrity
